# Native Linux x86_64, glibc >= 2.28 (Conda subdir: linux-64).
# Create this environment on Linux; do not copy a macOS Conda environment.
name: rulebook_linux
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - cmake=4.4.3
  - ninja=1.13.2
  - zstd=1.5.7
  # Linux compiler activation packages use major.minor version numbers.
  - clang_linux-64=22.1
  - clang=22.1.8
  - sysroot_linux-64=2.28
  - llvm-tools=22.1.8
  - compiler-rt=22.1.8
  - compiler-rt_linux-64=22.1.8
  - pip:
      - rl-language-core==0.4.18
      - numpy==1.26.4
      - gym3==0.3.3
